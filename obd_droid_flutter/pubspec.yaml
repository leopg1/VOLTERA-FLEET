name: voltera
description: "Voltera — suita de diagnoza OBD-II + fleet telemetry pentru ICE USV."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # CSV export
  csv: ^6.0.0

  # UI — gauges & charts
  syncfusion_flutter_gauges: ">=26.2.10 <28.0.0"
  syncfusion_flutter_charts: ">=26.2.10 <28.0.0"
  fl_chart: ^0.68.0

  # Vector graphics (car SVG, icons)
  flutter_svg: ^2.0.10+1

  # Animations & layout helpers
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

  # Fleet — cloud sync catre Supabase
  supabase_flutter: ^2.5.6
  uuid: ^4.4.0

  # Bluetooth Classic (SPP) pentru adaptoarele ELM327 BT clasice
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1

  # GPS real pentru Trip Analysis + fleet tracking
  geolocator: ^13.0.1

  # Harta reala in Trip Analysis (tile-uri OpenStreetMap, stil dark cu
  # CartoDB / Stadia). Acelasi look ca dashboard-ul web.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# ============================================================
# Launcher icons (rulam: flutter pub run flutter_launcher_icons)
# ============================================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/voltera_icon.png"
  adaptive_icon_background: "#070B12"
  adaptive_icon_foreground: "assets/images/voltera_icon_fg.png"
  min_sdk_android: 21

# ============================================================
# Splash screen branded (rulam: dart run flutter_native_splash:create)
# ============================================================
flutter_native_splash:
  color: "#070B12"
  image: assets/images/voltera_splash.png
  branding: assets/images/voltera_wordmark.png
  branding_mode: bottom
  android_12:
    color: "#070B12"
    image: assets/images/voltera_splash.png
  fullscreen: true
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/dtc/
    - assets/images/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
        - asset: assets/fonts/Orbitron-Variable.ttf
          weight: 400
        - asset: assets/fonts/Orbitron-Variable.ttf
          weight: 500
        - asset: assets/fonts/Orbitron-Variable.ttf
          weight: 600
        - asset: assets/fonts/Orbitron-Variable.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-Variable.ttf
          weight: 800
        - asset: assets/fonts/Orbitron-Variable.ttf
          weight: 900
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Light.ttf
          weight: 300
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
